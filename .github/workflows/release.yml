name: Markdown Presentation Tool — Release & Publish
# Serves: Markdown Presentation Tool (KunalPathak.markdown-presentation-tool)
# Branch: main | Tag prefix: mpt-v{version}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver without prefix, e.g. 1.2.3). Tag will be created as mpt-v{version}.'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "This workflow must be run from the main branch. Got: ${{ github.ref_name }}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0' # lowest Node in package.json engines
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests, format check and linter
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate version input format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Input version '${{ inputs.version }}' is not valid semver (expected X.Y.Z)."
            exit 1
          fi

      - name: Validate version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "${{ inputs.version }}" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match release input version (${{ inputs.version }})."
            exit 1
          fi

      - name: Validate CHANGELOG entry
        run: |
          if ! grep -qF "## [${{ inputs.version }}]" CHANGELOG.md; then
            echo "No CHANGELOG.md entry found for version ${{ inputs.version }}."
            echo "Add a '## [${{ inputs.version }}]' section before releasing."
            exit 1
          fi

      - name: Ensure release tag does not already exist
        run: |
          RELEASE_TAG="mpt-v${{ inputs.version }}"
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists on origin."
            exit 1
          fi

      - name: Package extension
        run: npm run package

      - name: Verify .vsix created
        run: |
          if [ ! -f *.vsix ]; then
            echo "Error: .vsix file not created"
            exit 1
          fi
          echo "Package created successfully"

      - name: Create Git Tag
        run: |
          RELEASE_TAG="mpt-v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mpt-v${{ inputs.version }}
          name: "Markdown Presentation Tool v${{ inputs.version }}"
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Marketplace publish is done manually after the release artifact is verified.
      # Run: vsce publish --pat <your-pat>  (from the repo root after npm ci)
