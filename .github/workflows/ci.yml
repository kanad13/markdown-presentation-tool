name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0' # lowest Node in package.json engines
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests, format check and linter
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Package extension
        run: npm run package

      - name: Verify .vsix created
        run: |
          if [ ! -f *.vsix ]; then
            echo "Error: .vsix file not created"
            exit 1
          fi
          echo "Package created successfully"
